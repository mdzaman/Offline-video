name: Release

# Builds standalone apps for macOS, Windows and Linux and publishes them as a GitHub Release, either
# when a tag like v1.2.0 is pushed, or from the Actions tab (Release → Run workflow) with a tag name.
# Run from the Actions tab with the tag left empty, it only builds the apps (as downloadable artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish, e.g. v1.2.0 (leave empty for a test build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: offline-video-macos-apple-silicon
          - os: windows-latest
            asset: offline-video-windows
          - os: ubuntu-latest
            asset: offline-video-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        shell: bash
        run: |
          pip install . pyinstaller
          pyinstaller --onefile --name offline-video \
            --collect-data offline_video --collect-all yt_dlp_ejs \
            packaging/launcher.py
      - name: Smoke test
        shell: bash
        run: ./dist/offline-video --version
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cd dist && 7z a "../out/${{ matrix.asset }}.zip" offline-video.exe
          else
            chmod +x dist/offline-video
            cd dist && zip "../out/${{ matrix.asset }}.zip" offline-video
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: out/*.zip

  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  publish:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Offline Video ${{ inputs.tag || github.ref_name }}
          files: |
            out/*.zip
            out/*.apk
          generate_release_notes: true
          body: |
            ## Download

            | Your computer | File |
            |---|---|
            | Mac (Apple silicon: M1/M2/M3/M4) | `offline-video-macos-apple-silicon.zip` |
            | Windows 10/11 | `offline-video-windows.zip` |
            | Linux | `offline-video-linux.zip` |
            | **Android phone** (most phones) | `offline-video-android-arm64.apk` |
            | Android, older 32-bit phones | `offline-video-android-armv7.apk` |
            | Android, not sure which | `offline-video-android-universal.apk` (bigger) |

            Unzip, then double-click `offline-video`. A browser tab opens with the app; keep the window
            that appears open while you use it. **Also install FFmpeg and Deno** for full-quality downloads
            (Mac: `brew install ffmpeg deno`, Windows: `winget install Gyan.FFmpeg DenoLand.Deno`).

            **Mac:** the first time, right-click the file and choose **Open** (it isn't signed by Apple).
            **Windows:** if SmartScreen appears, click **More info → Run anyway**.

            **Android:** open the `.apk` on your phone and allow installing from your browser when asked.
            Everything runs on the phone; share a YouTube link to *Offline Video* to download it.

            Intel Macs and everyone else can run from source, see the README.
