name: Android

# Builds the Android APKs and tests them in an emulator. Also used by the Release workflow.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", "offline_video/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "offline_video/**", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # same as the Python inside the app
      - name: Release signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with a temporary debug key"
          fi
      - name: Build APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Name the APKs
        run: |
          mkdir -p out
          d=android/app/build/outputs/apk/release
          cp "$d/app-arm64-v8a-release.apk"   out/offline-video-android-arm64.apk
          cp "$d/app-armeabi-v7a-release.apk" out/offline-video-android-armv7.apk
          cp "$d/app-x86_64-release.apk"      out/offline-video-android-x86_64.apk
          cp "$d/app-universal-release.apk"   out/offline-video-android-universal.apk
          ls -la out
      - uses: actions/upload-artifact@v5
        with:
          name: android-apks
          path: out/*.apk

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: android-apks
          path: apks
      - name: Serve a test clip to the emulator
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p "$RUNNER_TEMP/srv"
          ffmpeg -loglevel error -f lavfi -i testsrc=duration=3:size=320x240:rate=15 -f lavfi -i sine=duration=3 \
            -c:v libx264 -c:a aac -shortest "$RUNNER_TEMP/srv/clip.mp4"
          (cd "$RUNNER_TEMP/srv" && nohup python3 -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/ci/emulator-test.sh apks/offline-video-android-x86_64.apk
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: emulator-screenshot
          path: emulator-screenshot.png
          if-no-files-found: ignore
