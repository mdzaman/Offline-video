<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e5322d">
  <title>Offline Video</title>
  <link rel="icon" href="/static/icons/icon-192.png">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f6f6f8; color: #16161a; }
    @media (prefers-color-scheme: dark) { body { background: #111114; color: #ececf1; } }
    main { max-width: 420px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 22px; margin: 12px 0 8px; }
    ol { text-align: left; padding-left: 1.2em; }
  </style>
</head>
<body>
  <main>
    <img src="/static/icons/icon-192.png" alt="">
    <h1>Connect this phone</h1>
    <p>For privacy, Offline Video only opens on phones that have its link.</p>
    <ol>
      <li>On your computer, open Offline Video and turn on <strong>Use on your phone</strong>.</li>
      <li>Scan the QR code it shows with this phone's camera.</li>
    </ol>
  </main>
</body>
</html>
