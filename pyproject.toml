[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-video"
dynamic = ["version"]
description = "Download YouTube videos and playlists and watch them offline, from a simple web page."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["flask>=3.0", "segno>=1.6", "yt-dlp[default]>=2025.11.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
offline-video = "offline_video.app:main"

[project.urls]
Homepage = "https://github.com/mdzaman/Offline-video"
Issues = "https://github.com/mdzaman/Offline-video/issues"

[tool.setuptools]
packages = ["offline_video"]

[tool.setuptools.package-data]
offline_video = ["templates/*.html", "static/*", "static/icons/*"]

[tool.setuptools.dynamic]
version = { attr = "offline_video.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
